/* 上に折りたためる設定（砲塔ごとのレーザー）、その下に早見表（左に10%ごとの索引）。早見表が主役 */
:root{
  --bg:#eef1f0; --panel:#ffffff; --fg:#1b2422; --muted:#5d6b68; --line:#cfd8d5;
  --accent:#b8650a; --band:#f4f7f6;
  --brand-ink:#16202b; --brand:#0e7490;
  --good:#1f7a4d; --bad:#b3261e;
  --f-disp:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --panel:#172120; --fg:#e4ecea; --muted:#8fa19d; --line:#2a3836;
  --accent:#f0a040; --band:#1c2726; --brand-ink:#e3e9f0; --brand:#38bdd8; --good:#5cd394; --bad:#ff7b72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1514; --panel:#172120; --fg:#e4ecea; --muted:#8fa19d; --line:#2a3836;
  --accent:#f0a040; --band:#1c2726; --brand-ink:#e3e9f0; --brand:#38bdd8; --good:#5cd394; --bad:#ff7b72; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:8px 16px}
header .ttl{min-width:0;flex:1 1 20rem}
header h1{font-family:var(--f-disp);font-weight:600;font-size:1.7rem;letter-spacing:.04em;margin:0;text-wrap:balance;color:var(--brand-ink)}
header h1 span{color:var(--brand)}
header p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.sub{color:var(--muted);font-size:12px;letter-spacing:.04em;display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:4px}
.sub .ver{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 5px}
.row2 .field.gad{flex:0 1 22rem}
.lang{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.lang button{font-family:var(--f-body);font-size:.85rem;padding:5px 12px;border:0;background:var(--panel);color:var(--fg);cursor:pointer}
.lang button+button{border-left:1px solid var(--line)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
.lang button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 18px;min-width:0}
.label{font-family:var(--f-disp);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* 設定（折りたたみ） */
.settings summary{cursor:pointer;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;list-style:none}
.settings summary::-webkit-details-marker{display:none}
.settings summary::before{content:"▸";color:var(--accent);font-size:.9rem;transition:transform .15s}
.settings[open] summary::before{transform:rotate(90deg)}
.settings summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:2px}
.sumtext{font-family:var(--f-mono);font-size:.9rem;min-width:0}
.sumtext b{color:var(--accent);font-weight:600}
.setbody{display:grid;gap:14px;margin-top:14px}
.turrets{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:760px){.turrets{grid-template-columns:1fr}}
.field{display:grid;gap:4px;align-content:start;min-width:0}
.field>label{font-family:var(--f-disp);font-size:.85rem;letter-spacing:.04em}
.field select{font-family:var(--f-mono);font-size:1rem;padding:8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);width:100%;box-sizing:border-box}
.field select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.spec{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:.8rem;color:var(--muted)}
.spec b{font-family:var(--f-mono);color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.spec b.good{color:var(--good)}
.spec b.bad{color:var(--bad)}
.row2{display:flex;flex-wrap:wrap;gap:14px;align-items:end}
.row2 .field{flex:1 1 16rem}
.btn{font-family:var(--f-body);font-size:.85rem;padding:8px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hint{margin:0;color:var(--muted);font-size:.8rem}

/* 早見表 */
.main{display:grid;gap:10px}
.main h2{font-family:var(--f-disp);font-size:1.05rem;margin:0;letter-spacing:.03em}
.mainhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px}
.basisnote{margin:0;color:var(--muted);font-size:.82rem}
.tblwrap{display:flex;gap:8px;align-items:flex-start}
.idx{display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px)}
.idx button{font-family:var(--f-mono);font-size:.85rem;font-variant-numeric:tabular-nums;padding:6px 8px;min-width:3.4em;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);cursor:pointer;text-align:right}
.idx button:hover{border-color:var(--accent)}
.idx button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.idx button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.tbl{flex:1;min-width:0;overflow:auto;max-height:max(44rem, calc(100dvh - 32px));border:1px solid var(--line);border-radius:4px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.95rem}
th,td{padding:6px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);font-family:var(--f-disp);font-weight:500;color:var(--muted);font-size:.8rem;letter-spacing:.04em;vertical-align:bottom;line-height:1.35}
th small{display:block;font-family:var(--f-mono);font-size:.72rem;letter-spacing:0;color:var(--accent)}
.thead-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.use{display:flex;align-items:center;gap:6px;font-size:.85rem;cursor:pointer;user-select:none}
.use input{width:1.1rem;height:1.1rem;accent-color:var(--accent);margin:0;cursor:pointer}
.field.off select,.field.off .spec{opacity:.45}
.mods{display:grid;gap:4px}
.mods select{font-size:.85rem;padding:5px 8px}
.mods .ml{font-size:.75rem;color:var(--muted)}
th.grp{text-align:center;color:var(--fg);border-bottom:0;padding-bottom:0}
th.grp small{display:inline;margin-left:6px}
.gs{border-left:2px solid var(--line)}
td.rv{color:var(--fg)}
th.bcol{text-align:left;vertical-align:bottom}
td.rv.key{color:var(--muted)}
tr.ten td{background:var(--band)}
tr.ten td.key{color:var(--accent);font-weight:600}

.notes{color:var(--muted);font-size:.85rem;margin:0;padding-left:1.2em;display:grid;gap:4px}
.notes b{color:var(--fg);font-weight:600}
footer{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:14px;font-size:13px;color:var(--fg)}
footer p{margin:0}
footer a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){.settings summary::before{transition:none}}
/* Artifact の骨組みにある規則。GitHub Pages 版にはないので自前で持つ */
[hidden]{display:none!important}
/* 画面の切り替え（早見表／装備一覧） */
.views{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.views button{font-family:var(--f-disp);font-size:.95rem;letter-spacing:.03em;padding:8px 16px;border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;background:transparent;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.views button[aria-selected="true"]{background:var(--panel);border-color:var(--line);color:var(--fg)}
.views button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.calc{display:grid;gap:16px}
/* 装備一覧 */
.eq{display:grid;gap:10px}
.eqbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.eqkind{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--panel)}
.eqkind button{font-family:var(--f-body);font-size:.88rem;padding:6px 14px;border:0;background:transparent;color:var(--fg);cursor:pointer}
.eqkind button+button{border-left:1px solid var(--line)}
.eqkind button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
.eqkind button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.eqbar input,.eqbar select{font-family:var(--f-body);font-size:.88rem;padding:6px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--fg);min-width:0}
.eqbar input{flex:1 1 12rem;max-width:20rem}
.eqbar input:focus-visible,.eqbar select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.eqcount{color:var(--muted);font-size:.82rem}
#eqTbl th{cursor:pointer;user-select:none}
#eqTbl th:first-child{text-align:left}
#eqTbl th[data-dir="asc"]::after{content:" ▲";color:var(--accent)}
#eqTbl th[data-dir="desc"]::after{content:" ▼";color:var(--accent)}
#eqTbl td.nm{font-family:var(--f-body);font-weight:600;text-align:left}
#eqTbl td.nm small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}
#eqTbl tbody tr.item{cursor:pointer}
#eqTbl tbody tr.item:hover td{background:var(--band)}
#eqTbl td.good{color:var(--good)}
#eqTbl td.bad{color:var(--bad)}
#eqTbl td.dim{color:var(--muted)}
#eqTbl tr.shoprow td{background:var(--band);text-align:left;font-family:var(--f-body);font-size:.85rem;white-space:normal}
.shoplist{margin:0;padding-left:1.2em;columns:2 22rem;column-gap:24px}
.shoplist b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:.72rem;padding:0 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);font-family:var(--f-body);font-weight:400}
.pill.act{border-color:var(--accent);color:var(--accent)}
</style>

let lang = 'ja';
const T = k => STR[k][lang === 'en' ? 1 : 0];

const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('en-US');
const pct = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + Math.abs(n) + '%';
const TUR = ['t1','t2','t3'];
const laserOf = id => LASERS.find(l => l.id === $(id).value) || LASERS[0];
const modOf = id => MODULES.find(m => m.id === id);
// 装備一覧のデータ（Wiki API）から同じ品を引く
const eqLaser = L => (EQUIP.lasers || []).find(e => e.name === L.name + ' Mining Laser') || {};
const eqMod = m => (EQUIP.modules || []).find(e => e.name === m.name + ' Module') || {};
// 補正（%）を掛け算で重ねる
const comb = vs => (vs.reduce((a, v) => a * (1 + (v || 0)/100), 1) - 1) * 100;
const modLabel = m => {
  const fx = [];
  if (m.act) fx.push(`${T('active')} ${m.act}${T('sec')}`);
  if (m.pow) fx.push(`${T('pow')} ${pct(m.pow)}`);
  if (m.res) fx.push(`${T('resMod')} ${pct(m.res)}`);
  const e = eqMod(m);
  if (e.inst) fx.push(`${T('inst')} ${pct(e.inst)}`);
  if (e.win) fx.push(`${T('cWin')} ${pct(e.win)}`);
  if (e.rate || e.allrate) fx.push(`${T('cRate')} ${pct(Math.round(comb([e.rate, e.allrate]) * 10) / 10)}`);
  return `${m.name}` + (lang === 'en' ? ` (${fx.join(', ')})` : `（${fx.join('・')}）`);
};
// 砲塔のモジュール枠を、レーザーの枠数に合わせて作り直す（選んでいた値は残す）
function buildSlots(n, keepVals){
  const L = laserOf('t' + n), box = $('ms' + n);
  const prev = keepVals || [...box.querySelectorAll('select')].map(x => x.value);
  let h = '';
  for (let k = 0; k < L.slots; k++) {
    h += `<select id="m${n}_${k}" aria-label="${T('t' + n)} ${T('slot')} ${k+1}"><option value="">${T('slot')} ${k+1}: ${T('noMod')}</option>` +
      MODULES.map(m => `<option value="${m.id}">${modLabel(m)}</option>`).join('') + '</select>';
  }
  box.innerHTML = h;
  box.querySelectorAll('select').forEach((x, k) => { if (prev[k] && modOf(prev[k])) x.value = prev[k]; });
}
const modsOf = n => [...$('ms' + n).querySelectorAll('select')].map(x => modOf(x.value)).filter(Boolean);
// 砲塔1つ分：出力（モジュールの出力補正を掛ける）と耐性の倍率（レーザーとモジュールの耐性補正の積）
function rigOf(n){
  const L = laserOf('t' + n), ms = modsOf(n);
  const pow = L.pow * ms.reduce((a, m) => a * (1 + (m.pow || 0)/100), 1);
  const m = (1 + L.res/100) * ms.reduce((a, x) => a * (1 + (x.res || 0)/100), 1);
  const key = L.id + '|' + ms.map(x => x.id).sort().join(',');
  const label = L.name + (ms.length ? ' + ' + ms.map(x => x.name).join(', ') : '');
  // 不安定性・最適チャージ幅・最適チャージ速度（全チャージ速度も含む）。レーザーとモジュールの補正の積
  const eL = eqLaser(L), eM = ms.map(eqMod);
  const inst = comb([eL.inst, ...eM.map(e => e.inst)]);
  const win = comb([eL.win, ...eM.map(e => e.win)]);
  const rate = comb([eL.rate, eL.allrate, ...eM.map(e => e.rate), ...eM.map(e => e.allrate)]);
  return {L, ms, pow, m, key, label, inst, win, rate};
}

function maxMass(rigs, rockRes){
  const power = rigs.reduce((s, r) => s + r.pow, 0);
  // スキャナの耐性はすでにレーザー・ガジェットの補正込みなので、そのまま使う
  const eff = rockRes;
  return eff >= 100 ? 0 : power * 5 * (1 - eff/100);
}

function applyLang(){
  document.documentElement.lang = lang;
  document.title = T('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = T(el.dataset.i18nHtml); });
  $('notes').innerHTML = T('notes').map(s => `<li>${s}</li>`).join('');
  $('idx').setAttribute('aria-label', T('idx'));
  $('langJa').setAttribute('aria-pressed', lang === 'ja');
  $('langEn').setAttribute('aria-pressed', lang === 'en');
  TUR.forEach(id => {
    const v = $(id).value;
    $(id).innerHTML = LASERS.map(l => `<option value="${l.id}">${l.name}${l.stock ? '（' + T('stock') + '）' : ''}</option>`).join('');
    if (lang === 'en') $(id).querySelectorAll('option').forEach(o => o.textContent = o.textContent.replace('（', ' (').replace('）', ')'));
    $(id).value = v || 'arbor';
  });
  [1,2,3].forEach(n => buildSlots(n));
  const gv = $('gadget').value;
  $('gadget').innerHTML = `<option value="">${T('noMod')}</option>` + GADGETS.map(g => {
    const fx = [];
    if (g.res) fx.push(`${T('resMod')} ${pct(g.res)}`);
    if (g.inst) fx.push(`${T('inst')} ${pct(g.inst)}`);
    if (!g.res) fx.unshift(T('noFx'));
    return `<option value="${g.id}">${g.name}` + (lang === 'en' ? ` (${fx.join(', ')})` : `（${fx.join('・')}）`) + '</option>';
  }).join('');
  $('gadget').value = gv;
  $('gameVer').textContent = T('gameVer') + GAME_VERSION;
  $('fetched').textContent = T('fetched') + DATA_FETCHED;
  $('appVer').textContent = 'v' + APP_VERSION;
  $('updated').textContent = T('updated') + APP_UPDATED + (lang === 'en' ? ' JST' : '');
  if (!$('viewEquip').hidden) renderEquip();
  render();
}

// 補正の表示。good: 1 = 大きいほど有利、-1 = 小さいほど有利
function spec(label, v, good){
  const r = Math.round(v * 10) / 10;
  const cls = !r ? '' : (r * good > 0 ? 'good' : 'bad');
  return `<span>${label} <b${cls ? ` class="${cls}"` : ''}>${pct(r)}</b></span>`;
}

function render(){
  const rigs = [1,2,3].map(rigOf);

  const used = [0,1,2].filter(i => $('u' + (i+1)).checked);
  TUR.forEach((id, i) => {
    const R = rigs[i], L = R.L;
    $('f' + (i+1)).classList.toggle('off', !used.includes(i));
    $('s' + (i+1)).innerHTML =
      `<span>${T('pow')} <b>${fmt(L.pow)}</b>${R.pow !== L.pow ? ` → ${T('effPow')} <b>${fmt(R.pow)}</b>` : ''}</span>` +
      spec(T('resMod'), (R.m - 1) * 100, -1) + spec(T('inst'), R.inst, -1) +
      spec(T('cWin'), R.win, 1) + spec(T('cRate'), R.rate, 1) +
      `<span>${T('range')} <b>${L.range} m</b></span>`;
  });
  const urs = used.map(i => rigs[i]);
  const same = urs.every(r => r.key === urs[0].key);
  const tn = idx => idx.map(i => i+1).join(lang === 'en' ? '+' : '・');
  const lasersTxt = same
    ? `<b>${urs[0].label}</b> ×${urs.length}` + (lang === 'en' ? ` (T${tn(used)})` : `（砲塔${tn(used)}）`)
    : used.map(i => `T${i+1} <b>${rigs[i].label}</b>`).join(' · ');
  const G = GADGETS.find(g => g.id === $('gadget').value);
  const gm = G && G.res ? 1 + G.res/100 : 1;
  $('sumtext').innerHTML = lasersTxt + (G ? ` · ${T('gadgetS')} <b>${G.name}</b>` : '');

  // 列：使う砲塔それぞれ単独（同じ構成はまとめる）＋使う砲塔すべて同時
  const cols = [];
  const groups = [];
  used.forEach(i => { const g = groups.find(x => x.key === rigs[i].key); g ? g.idx.push(i) : groups.push({key: rigs[i].key, idx: [i]}); });
  if (used.length > 1 || groups.length === 1) groups.forEach(gp => {
    const head = gp.idx.length === 1
      ? (lang === 'en' ? `1 crew (T${gp.idx[0]+1})` : `1人（砲塔${gp.idx[0]+1}）`)
      : (lang === 'en' ? `1 crew (T${tn(gp.idx)})` : `1人（砲塔${tn(gp.idx)}のどれか）`);
    cols.push({head, sub: rigs[gp.idx[0]].label, set: [rigs[gp.idx[0]]]});
  });
  if (used.length > 1) cols.push({
    head: lang === 'en' ? `${used.length} crew (T${tn(used)})` : `${used.length}人（砲塔${tn(used)}）`,
    sub: same ? urs[0].label : '', set: urs});
  // 各列の耐性補正の倍率（照射中のレーザーの補正の掛け算）。行は元の耐性（スキャン時）を1%刻みにし、各列の照射中の耐性を推定する
  cols.forEach(c => { c.m = c.set.reduce((m, r) => m * r.m, 1) * gm; });
  let h = `<thead><tr><th rowspan="2" class="bcol">${T('resBase')}<small>${T('scanT')}</small></th>` +
    cols.map(c => `<th colspan="2" class="grp gs">${c.head}${c.sub ? `<small>${c.sub}</small>` : ''}</th>`).join('') + '</tr><tr>' +
    cols.map(() => `<th class="gs">${T('resLive')}</th><th>${T('massLim')}</th>`).join('') + '</tr></thead><tbody>';
  for (let rr=0; rr<=100; rr++){
    const vals = cols.map(c => { const r = rr * c.m; return {r, v: maxMass(c.set, r)}; });
    h += `<tr data-r="${rr}"${rr%10===0?' class="ten"':''}><td class="rv key">${rr}%</td>` +
      vals.map(x => `<td class="rv gs">${x.r < 100 ? Math.round(x.r) + '%' : '≥100%'}</td><td>${x.v > 0 ? fmt(x.v) : '—'}</td>`).join('') + '</tr>';
  }
  const keep = $('tblBox').scrollTop;
  $('tbl').innerHTML = h + '</tbody>';
  $('tblBox').scrollTop = keep;
  // 見出し2段目を1段目の下に固定
  const hr = $('tbl').tHead.rows;
  [...hr[1].cells].forEach(c => { c.style.top = hr[0].offsetHeight + 'px'; });

  let ix = '';
  for (let rr=0; rr<=100; rr+=10) ix += `<button type="button" data-r="${rr}">${rr}%</button>`;
  $('idx').innerHTML = ix;
  markIndex();

  try { localStorage.setItem('moleCrack3', JSON.stringify({g: $('gadget').value, t: TUR.map(id => $(id).value), m: [1,2,3].map(n => [...$('ms' + n).querySelectorAll('select')].map(x => x.value)), u: [1,2,3].map(n => $('u' + n).checked), lang})); } catch(e){}
}

// 表の枠で一番上に見えている行の区切りを、索引で強調
// 索引で飛んだ区切り（手でスクロールするまで強調を保つ。最後のほうは先頭まで上げられないため）
let jump = null;
function markIndex(){
  const box = $('tblBox'), t = $('tbl');
  const top = box.scrollTop + (t.tHead ? t.tHead.offsetHeight : 0);
  let cur = 0;
  for (const r of t.tBodies[0].rows) { if (r.offsetTop + r.offsetHeight/2 > top) { cur = +r.dataset.r; break; } }
  let sec = Math.floor(cur/10)*10;
  if (jump && Math.abs(box.scrollTop - jump.top) <= 2) sec = jump.r;
  else if (box.scrollTop > 0 && box.scrollTop + box.clientHeight >= box.scrollHeight - 2) sec = 100;
  else jump = null;
  $('idx').querySelectorAll('button').forEach(b => b.setAttribute('aria-current', +b.dataset.r === sec));
}

// 索引をクリックすると、その耐性の行を表の枠の一番上へ
$('idx').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  const t = $('tbl'), row = t.querySelector(`tr[data-r="${b.dataset.r}"]`); if (!row) return;
  $('tblBox').scrollTop = row.offsetTop - t.tHead.offsetHeight;
  jump = {r: +b.dataset.r, top: $('tblBox').scrollTop};
  markIndex();
});
$('tblBox').addEventListener('scroll', markIndex, {passive:true});
TUR.forEach((id, i) => $(id).addEventListener('change', () => { buildSlots(i+1); render(); }));
[1,2,3].forEach(n => $('ms' + n).addEventListener('change', render));
$('gadget').addEventListener('change', render);
// 使う砲塔：最後の1つは外せない
[1,2,3].forEach(n => $('u' + n).addEventListener('change', ev => {
  if (![1,2,3].some(k => $('u' + k).checked)) ev.target.checked = true;
  render();
}));
$('sameAll').addEventListener('click', () => {
  const mv = [...$('ms1').querySelectorAll('select')].map(x => x.value);
  [2,3].forEach(n => { $('t' + n).value = $('t1').value; buildSlots(n, mv); });
  render();
});
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; applyLang(); }));
$('settings').addEventListener('toggle', () => {
  try { localStorage.setItem('moleCrackOpen', $('settings').open ? '1' : '0'); } catch(e){}
});

// 整数は桁区切り、小数は小数第2位まで（0.25 や 2.5 秒を丸めない）
const fmtN = v => Number.isInteger(v) ? fmt(v) : (Math.round(v * 100) / 100).toLocaleString('en-US');
// good: 1 = 大きいほど採掘に有利、-1 = 小さいほど有利、0 = 色なし

  ],
  modules: [
    {k:'active', l:'cType', f: r => r.active ? `<span class="pill act">${T('active2')}</span>` : `<span class="pill">${T('passive')}</span>`, sv: r => r.active ? 1 : 0},
    {k:'uses', l:'cUses'}, {k:'dur', l:'cDur', u: () => T('sec')},
    {k:'pow', l:'cPowM', pct:1, good:1}, {k:'res', l:'cRes', pct:1, good:-1}, {k:'inst', l:'cInst', pct:1, good:-1},
    {k:'win', l:'cWin', pct:1, good:1}, {k:'rate', l:'cRate', pct:1, good:1}, {k:'over', l:'cOver', pct:1, good:-1},
    {k:'allrate', l:'cAll', pct:1, good:1}, {k:'inert', l:'cInert', pct:1, good:0}, {k:'shatter', l:'cShat', pct:1, good:-1},
  ],
  gadgets: [
    {k:'res', l:'cRes', pct:1, good:-1}, {k:'inst', l:'cInst', pct:1, good:-1}, {k:'win', l:'cWin', pct:1, good:1},
    {k:'rate', l:'cRate', pct:1, good:1}, {k:'cluster', l:'cClus', pct:1, good:0},
  ],
  radars: [
    {k:'size', l:'cSize'}, {k:'grade', l:'cGrade', txt:1}, {k:'cls', l:'cClass', txt:1},
    {k:'resrc', l:'cRsrc', x:1}, {k:'gres', l:'cGres', x:1}, {k:'pres', l:'cPres', x:1},
    {k:'ir', l:'cIR', x:1}, {k:'em', l:'cEM', x:1}, {k:'cs', l:'cCS', x:1},
    {k:'cool', l:'cCool', u: () => T('sec')}, {k:'power', l:'cPwr'}, {k:'emsig', l:'cEMs'}, {k:'hp', l:'cHP'},
  ],
};
const priceCol = {k:'price', l:'cPrice', f: r => r.shops && r.shops.length ? fmt(r.shops[0][0]) + ' aUEC' : '—', sv: r => r.shops && r.shops.length ? r.shops[0][0] : null};

function eqCell(c, r){
  if (c.f) return {h: c.f(r), cls: ''};
  const v = r[c.k];
  if (v == null || v === '') return {h: '—', cls: 'dim'};
  if (c.txt) return {h: String(v), cls: ''};
  if (c.pct) return {h: sgn(v), cls: !v || !c.good ? '' : (v * c.good > 0 ? 'good' : 'bad')};
  if (c.x) return {h: fmtN(v), cls: ''};
  const u = typeof c.u === 'function' ? c.u() : (c.u || '');
  return {h: fmtN(v) + u, cls: ''};
}

function renderEquip(){
  document.querySelectorAll('#eqKind button').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === eqKind));
  $('eqQ').placeholder = T('eqQ');
  $('eqNote').textContent = T(eqKind === 'radars' ? 'eqNoteR' : 'eqNoteL');
  const rows0 = EQUIP[eqKind] || [];
  // サイズの絞り込み（サイズがある種類だけ）
  const sizes = [...new Set(rows0.map(r => r.size).filter(v => v != null))].sort((a, b) => a - b);
  const sv = $('eqSize').value;
  $('eqSize').hidden = eqKind === 'modules' || eqKind === 'gadgets';
  $('eqSize').innerHTML = `<option value="">${T('allSize')}</option>` + sizes.map(z => `<option value="${z}">${T('sizeN')} ${z}</option>`).join('');
  $('eqSize').value = sizes.includes(+sv) && sv !== '' ? sv : '';
  const q = $('eqQ').value.trim().toLowerCase();
  const size = $('eqSize').hidden ? '' : $('eqSize').value;
  let rows = rows0.filter(r => (!q || (r.name + ' ' + (r.mfr || '')).toLowerCase().includes(q)) && (size === '' || String(r.size) === size));
  const cols = [...EQCOLS[eqKind], priceCol];
  if (eqSort && eqSort.kind === eqKind) {
    const c = eqSort.k === 'name' ? null : cols.find(x => x.k === eqSort.k);
    const val = r => c ? (c.sv ? c.sv(r) : r[c.k]) : r.name;
    rows = rows.slice().sort((a, b) => {
      const x = val(a), y = val(b);
      if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
      const d = typeof x === 'string' ? x.localeCompare(y) : x - y;
      return eqSort.dir === 'asc' ? d : -d;
    });
  }
  const dirOf = k => eqSort && eqSort.kind === eqKind && eqSort.k === k ? eqSort.dir : null;
  let h = '<thead><tr>' + [{k:'name', l:'cName'}, ...cols].map(c => {
    const d = dirOf(c.k);
    return `<th data-k="${c.k}"${d ? ` data-dir="${d}" aria-sort="${d === 'asc' ? 'ascending' : 'descending'}"` : ''}>${T(c.l)}</th>`;
  }).join('') + '</tr></thead><tbody>';
  rows.forEach(r => {
    const id = eqKind + ':' + r.name;
    h += `<tr class="item" data-id="${id.replace(/"/g, '&quot;')}" tabindex="0"><td class="nm">${r.name}${r.mfr ? `<small>${r.mfr}</small>` : ''}</td>` +
      cols.map(c => { const x = eqCell(c, r); return `<td${x.cls ? ` class="${x.cls}"` : ''}>${x.h}</td>`; }).join('') + '</tr>';
    if (eqOpen === id) {
      h += `<tr class="shoprow"><td colspan="${cols.length + 1}">` + (r.shops && r.shops.length
        ? `<b>${T('shopsAt')}</b><ul class="shoplist">` + r.shops.map(s => `<li><b>${fmt(s[0])}</b> aUEC — ${s[1]}${s[2] ? ` (${s[2]})` : ''}</li>`).join('') + '</ul>'
        : T('noShop')) + '</td></tr>';
    }
  });
  $('eqTbl').innerHTML = h + '</tbody>';
  $('eqCount').textContent = lang === 'en' ? `${rows.length} ${T('items')}` : `${rows.length}${T('items')}`;
}

function setView(v){
  const eq = v === 'equip';
  $('viewCalc').hidden = eq; $('viewEquip').hidden = !eq;
  $('vCalc').setAttribute('aria-selected', !eq); $('vEquip').setAttribute('aria-selected', eq);
  if (eq) renderEquip();
  try { localStorage.setItem('moleView', v); } catch(e){}
}
document.querySelectorAll('.views button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
document.querySelectorAll('#eqKind button').forEach(b => b.addEventListener('click', () => { eqKind = b.dataset.k; eqOpen = null; renderEquip(); }));
$('eqQ').addEventListener('input', renderEquip);
$('eqSize').addEventListener('change', renderEquip);
$('eqTbl').addEventListener('click', ev => {
  const th = ev.target.closest('th');
  if (th) {
    const k = th.dataset.k, cur = eqSort && eqSort.kind === eqKind && eqSort.k === k ? eqSort.dir : null;
    eqSort = cur === 'desc' ? {kind: eqKind, k, dir: 'asc'} : cur === 'asc' ? null : {kind: eqKind, k, dir: k === 'name' ? 'asc' : 'desc'};
    if (k === 'name' && cur === null) eqSort = {kind: eqKind, k, dir: 'asc'};
    renderEquip(); return;
  }
  const tr = ev.target.closest('tr.item');
  if (tr) { eqOpen = eqOpen === tr.dataset.id ? null : tr.dataset.id; renderEquip(); }
});
$('eqTbl').addEventListener('keydown', ev => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('tr.item')) { ev.preventDefault(); ev.target.click(); }
});

let saved = null;
try { saved = JSON.parse(localStorage.getItem('moleCrack3') || 'null'); } catch(e){}
lang = saved && saved.lang ? saved.lang : (/^ja\b/i.test(navigator.language || '') ? 'ja' : 'en');
TUR.forEach(id => { $(id).innerHTML = LASERS.map(l => `<option value="${l.id}">${l.name}</option>`).join(''); });
if (saved) {
  (saved.t || []).forEach((v, i) => { if (LASERS.some(l => l.id === v)) $(TUR[i]).value = v; });
  if (saved.g && GADGETS.some(g => g.id === saved.g)) $('gadget').innerHTML = `<option value="${saved.g}" selected></option>`;
  if (Array.isArray(saved.m)) saved.m.forEach((mv, i) => { if (Array.isArray(mv)) buildSlots(i+1, mv); });
  if (Array.isArray(saved.u) && saved.u.some(Boolean)) saved.u.forEach((c, i) => { $('u' + (i+1)).checked = !!c; });
}
try { if (localStorage.getItem('moleCrackOpen') === '1') $('settings').open = true; } catch(e){}
applyLang();
try { if (location.hash === '#equip' || localStorage.getItem('moleView') === 'equip') setView('equip'); } catch(e){}
</script>

</body>
</html>
