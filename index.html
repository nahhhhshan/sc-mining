<style>

  --accent:#b8650a; --band:#f4f7f6;
  --f-disp:"Chakra Petch",ui-sans-serif,system-ui,sans-serif;

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1514; --panel:#172120; --fg:#e4ecea; --muted:#8fa19d; --line:#2a3836;
  --accent:#f0a040; --band:#1c2726; color-scheme:dark}}

  --bg:#0f1514; --panel:#172120; --fg:#e4ecea; --muted:#8fa19d; --line:#2a3836;
  --accent:#f0a040; --band:#1c2726; color-scheme:dark}

.idx{display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px)}
.idx button{font-family:var(--f-mono);font-size:.85rem;font-variant-numeric:tabular-nums;padding:6px 8px;min-width:3.4em;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);cursor:pointer;text-align:right}
.idx button:hover{border-color:var(--accent)}

.idx button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}

th small{display:block;font-family:var(--f-mono);font-size:.72rem;letter-spacing:0;color:var(--accent)}
.thead-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.use{display:flex;align-items:center;gap:6px;font-size:.85rem;cursor:pointer;user-select:none}
.use input{width:1.1rem;height:1.1rem;accent-color:var(--accent);margin:0;cursor:pointer}
.field.off select,.field.off .spec{opacity:.45}
td:first-child,th:first-child{text-align:left}
tr.ten td{background:var(--band)}
tr.ten td:first-child{color:var(--accent);font-weight:600}

.notes{color:var(--muted);font-size:.85rem;margin:0;padding-left:1.2em;display:grid;gap:4px}

footer{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:14px;font-size:13px;color:var(--fg)}

<script>
// サイズ2の採掘レーザー（Star Citizen Wiki API、4.10.1-LIVE）。res = 抵抗補正（%）、inst = 不安定性補正（%）、range = 最適射程（m）
const LASERS = [
  {id:'arbor',    name:'Arbor MH2',   stock:true, pow:2900, res: 25, inst:-35, range:90, slots:2},
  {id:'helix',    name:'Helix II',    pow:4930, res:-30, inst:  0, range:30, slots:3},
  {id:'hofstede', name:'Hofstede-S2', pow:4060, res:-30, inst: 10, range:60, slots:2},
  {id:'impact',   name:'Impact II',   pow:4060, res: 10, inst:-10, range:60, slots:3},
  {id:'klein',    name:'Klein-S2',    pow:4350, res:-45, inst: 35, range:60, slots:1},
  {id:'lancet',   name:'Lancet MH2',  pow:4350, res:  0, inst:-10, range:45, slots:2},
];

// 文言：[日本語, English]
const STR = {
  title:   ['MOLE 破砕判定', 'MOLE Rock Breaker'],
  lead:    ['スキャンした岩の抵抗の行を見て、質量が表の値以下なら割れます。列は同じ岩を照射する砲塔の組み合わせです。',
            'Find the row for the scanned rock\'s resistance. If its mass is at or below the value, you can crack it. Columns are the turrets firing on the same rock.'],
  settings:['設定', 'Setup'],
  t1:      ['砲塔1', 'Turret 1'], t2:['砲塔2', 'Turret 2'], t3:['砲塔3', 'Turret 3'],
  same:    ['全砲塔を砲塔1と同じにする', 'Set all turrets to Turret 1'],
  hint:    ['レンタルの MOLE は3門とも Arbor MH2 です。掘る人数に合わせて、人が座る砲塔だけ「使う」にチェックしてください。',
            'A rental MOLE has Arbor MH2 on all three turrets. Check "Use" only on the turrets that will be crewed.'],
  use:     ['使う', 'Use'],
  resLive: ['耐性', 'Resistance (scan)'],
  nLive:   ['スキャナの抵抗は、いま照射しているレーザーとガジェットの補正が入った値です。掘るときと同じ門数で照射しながら抵抗を読み、その門数の列で見てください。',
            'The scanner shows resistance with the modifiers of the lasers and gadget currently on the rock. Read it while firing with the same turrets you will use, then check that column.'],
  h2:      ['割れる最大質量', 'Max crackable mass'],
  res:     ['岩の抵抗', 'Rock resistance'],
  pow:     ['出力', 'Power'], resMod:['抵抗', 'Resist'], inst:['不安定性', 'Instability'],
  range:   ['最適射程', 'Optimal range'], slots:['モジュール枠', 'Module slots'],
  stock:   ['標準・レンタル', 'stock / rental'],
  perT:    ['/門', '/turret'],
  idx:     ['抵抗の行へ移動', 'Jump to resistance'],
  noticeJa:['非公式のファンサイトで、Cloud Imperium とは関係ありません。', ''],
  official:['公式サイト（RSI）', 'Official site (RSI)'],
  credit:  ['レーザーの値: <a href="https://api.star-citizen.wiki/" target="_blank" rel="noopener">Star Citizen Wiki API</a>（4.10.1）。計算式: <a href="https://uverse.space/mining/fracture" target="_blank" rel="noopener">UVerse</a> ほかコミュニティの実測。',
            'Laser stats: <a href="https://api.star-citizen.wiki/" target="_blank" rel="noopener">Star Citizen Wiki API</a> (4.10.1). Formula: <a href="https://uverse.space/mining/fracture" target="_blank" rel="noopener">UVerse</a> and other community testing.'],
  notes: [[
    '<b>計算式</b>：割れる最大質量 = 照射中のレーザーの出力の合計 × 5 × (1 − スキャナの抵抗)。CIG 非公開のため、コミュニティが実測で出した近似です。',
    '表の値ちょうどの岩は、チャージを最大近くまで上げてようやく割れます。不安定な岩は、表の値より1〜2割軽いものを選ぶと安全です。',
    '操縦席からはレーザーを撃てません。砲塔ごとに1人ずつ必要です。',
    '最適射程の外では出力が落ちます。判定どおりにならないときは近づいてください。',
    'レーザーモジュールは計算に入れていません。出力が上がるモジュールを積めば、表の値より少し重い岩も割れます。',
  ], [
    '<b>Formula</b>: max crackable mass = total power of the firing lasers × 5 × (1 − scanned resistance). CIG has not published this; it is a community estimate from testing.',
    'A rock right at the limit cracks only near full throttle. For unstable rocks, pick ones 10–20% lighter than the value.',
    'The pilot seat has no mining laser. Each turret needs its own crew member.',
    'Power drops outside optimal range. Move closer if a rock does not crack as expected.',
    'Laser modules are not included. With power modules you can crack slightly heavier rocks than shown.',
  ]],
};
let lang = 'ja';
const T = k => STR[k][lang === 'en' ? 1 : 0];

const $ = id => document.getElementById(id);
const fmt = n => Math.round(n).toLocaleString('en-US');
const pct = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + Math.abs(n) + '%';
const TUR = ['t1','t2','t3'];
const laserOf = id => LASERS.find(l => l.id === $(id).value) || LASERS[0];

function maxMass(lasers, rockRes){
  const power = lasers.reduce((s, l) => s + l.pow, 0);
  // スキャナの抵抗はすでにレーザー・ガジェットの補正込みなので、そのまま使う
  const eff = rockRes;
  return eff >= 100 ? 0 : power * 5 * (1 - eff/100);
}

function applyLang(){
  document.documentElement.lang = lang;
  document.title = T('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(el => { el.innerHTML = T(el.dataset.i18nHtml); });
  $('notes').innerHTML = T('notes').map(s => `<li>${s}</li>`).join('');
  $('idx').setAttribute('aria-label', T('idx'));
  $('langJa').setAttribute('aria-pressed', lang === 'ja');
  $('langEn').setAttribute('aria-pressed', lang === 'en');
  TUR.forEach(id => {
    const v = $(id).value;
    $(id).innerHTML = LASERS.map(l => `<option value="${l.id}">${l.name}${l.stock ? '（' + T('stock') + '）' : ''}</option>`).join('');
    if (lang === 'en') $(id).querySelectorAll('option').forEach(o => o.textContent = o.textContent.replace('（', ' (').replace('）', ')'));
    $(id).value = v || 'arbor';
  });
  render();
}

function render(){
  const ls = TUR.map(laserOf);

  const used = [0,1,2].filter(i => $('u' + (i+1)).checked);
  TUR.forEach((id, i) => {
    const L = ls[i];
    $('f' + (i+1)).classList.toggle('off', !used.includes(i));
    $('s' + (i+1)).innerHTML =
      `<span>${T('pow')} <b>${fmt(L.pow)}</b></span><span>${T('resMod')} <b>${pct(L.res)}</b></span>` +
      `<span>${T('inst')} <b>${pct(L.inst)}</b></span><span>${T('range')} <b>${L.range} m</b></span>`;
  });
  const uls = used.map(i => ls[i]);
  const same = uls.every(l => l.id === uls[0].id);
  const tn = idx => idx.map(i => i+1).join(lang === 'en' ? '+' : '・');
  const lasersTxt = same
    ? `<b>${uls[0].name}</b> ×${uls.length}` + (lang === 'en' ? ` (T${tn(used)})` : `（砲塔${tn(used)}）`)
    : used.map(i => `T${i+1} <b>${ls[i].name}</b>`).join(' · ');
  $('sumtext').innerHTML = lasersTxt;

  // 列：使う砲塔それぞれ単独（同じレーザーはまとめる）＋使う砲塔すべて同時
  const cols = [];
  const groups = [];
  used.forEach(i => { const g = groups.find(x => x.id === ls[i].id); g ? g.idx.push(i) : groups.push({id: ls[i].id, idx: [i]}); });
  if (used.length > 1 || groups.length === 1) groups.forEach(gp => {
    const head = gp.idx.length === 1
      ? (lang === 'en' ? `Turret ${gp.idx[0]+1} only` : `砲塔${gp.idx[0]+1}のみ`)
      : (lang === 'en' ? `1 turret (T${tn(gp.idx)})` : `1門（砲塔${tn(gp.idx)}のどれか）`);
    cols.push({head, sub: ls[gp.idx[0]].name, set: [ls[gp.idx[0]]]});
  });
  if (used.length > 1) cols.push({
    head: lang === 'en' ? `${used.length} turrets together` : `${used.length}門同時`,
    sub: lang === 'en' ? 'T' + tn(used) : '砲塔' + tn(used), set: uls});
  const sets = cols.map(c => c.set);
  let h = `<thead><tr><th>${T('resLive')}</th>` + cols.map(c => `<th>${c.head}<small>${c.sub}</small></th>`).join('') + '</tr></thead><tbody>';
  for (let rr=0; rr<=99; rr++){
    const vals = sets.map(s => maxMass(s, rr));
    if (vals.every(v => v <= 0)) break;
    h += `<tr data-r="${rr}"${rr%10===0?' class="ten"':''}><td>${rr}%</td>` +
      vals.map(v => `<td>${v > 0 ? fmt(v) : '—'}</td>`).join('') + '</tr>';
  }
  const keep = $('tblBox').scrollTop;
  $('tbl').innerHTML = h + '</tbody>';
  $('tblBox').scrollTop = keep;

  const rows = $('tbl').tBodies[0].rows.length;
  let ix = '';
  for (let rr=0; rr<rows; rr+=10) ix += `<button type="button" data-r="${rr}">${rr}%</button>`;
  $('idx').innerHTML = ix;
  markIndex();

  try { localStorage.setItem('moleCrack3', JSON.stringify({t: TUR.map(id => $(id).value), u: [1,2,3].map(n => $('u' + n).checked), lang})); } catch(e){}
}

// 表の枠で一番上に見えている行の区切りを、索引で強調
function markIndex(){
  const box = $('tblBox'), t = $('tbl');
  const top = box.scrollTop + (t.tHead ? t.tHead.offsetHeight : 0);
  let cur = 0;
  for (const r of t.tBodies[0].rows) { if (r.offsetTop + r.offsetHeight/2 > top) { cur = +r.dataset.r; break; } }
  const sec = Math.floor(cur/10)*10;
  $('idx').querySelectorAll('button').forEach(b => b.setAttribute('aria-current', +b.dataset.r === sec));
}

// 索引をクリックすると、その抵抗の行を表の枠の一番上へ
$('idx').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  const t = $('tbl'), row = t.querySelector(`tr[data-r="${b.dataset.r}"]`); if (!row) return;
  $('tblBox').scrollTop = row.offsetTop - t.tHead.offsetHeight;
});
$('tblBox').addEventListener('scroll', markIndex, {passive:true});
TUR.forEach(id => $(id).addEventListener('change', render));
// 使う砲塔：最後の1つは外せない
[1,2,3].forEach(n => $('u' + n).addEventListener('change', ev => {
  if (![1,2,3].some(k => $('u' + k).checked)) ev.target.checked = true;
  render();
}));
$('sameAll').addEventListener('click', () => { $('t2').value = $('t1').value; $('t3').value = $('t1').value; render(); });
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; applyLang(); }));
$('settings').addEventListener('toggle', () => {
  try { localStorage.setItem('moleCrackOpen', $('settings').open ? '1' : '0'); } catch(e){}
});

let saved = null;
try { saved = JSON.parse(localStorage.getItem('moleCrack3') || 'null'); } catch(e){}
lang = saved && saved.lang ? saved.lang : (/^ja\b/i.test(navigator.language || '') ? 'ja' : 'en');
TUR.forEach(id => { $(id).innerHTML = LASERS.map(l => `<option value="${l.id}">${l.name}</option>`).join(''); });
if (saved) {
  (saved.t || []).forEach((v, i) => { if (LASERS.some(l => l.id === v)) $(TUR[i]).value = v; });
  if (Array.isArray(saved.u) && saved.u.some(Boolean)) saved.u.forEach((c, i) => { $('u' + (i+1)).checked = !!c; });
}
try { if (localStorage.getItem('moleCrackOpen') === '1') $('settings').open = true; } catch(e){}
applyLang();
